<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <radialGradient id="amberGlowMod" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kiteLeftMod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="kiteRightMod" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Selo Mãe Circular C-Orbital (Holding Change) em escala 2x -->
  <circle cx="82" cy="80" r="72" fill="#080c14" stroke="#1e293b" stroke-width="2"/>
  <circle cx="82" cy="80" r="64" fill="none" stroke="#10b981" stroke-width="5.5" stroke-dasharray="290 110" transform="rotate(25 82 80)"/>
  <circle cx="82" cy="80" r="55" fill="none" stroke="#06b6d4" stroke-width="4.2" stroke-dasharray="240 105" transform="rotate(32 82 80)"/>
  <circle cx="82" cy="80" r="47" fill="none" stroke="#2563eb" stroke-width="3.8" stroke-dasharray="195 95" transform="rotate(38 82 80)"/>
  <circle cx="82" cy="80" r="41" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="165 65" opacity="0.9" transform="rotate(20 82 80)"/>

  <!-- Prisma Central com Ápice Âmbar -->
  <circle cx="82" cy="44" r="14" fill="url(#amberGlowMod)"/>
  <polygon points="82,47 61,79 82,111" fill="url(#kiteLeftMod)" stroke="#34d399" stroke-width="1"/>
  <polygon points="82,47 103,79 82,111" fill="url(#kiteRightMod)" stroke="#22d3ee" stroke-width="1"/>
  <line x1="82" y1="47" x2="82" y2="111" stroke="#ffffff" stroke-width="2.2"/>
  <circle cx="82" cy="45" r="5.2" fill="#f59e0b" stroke="#fef3c7" stroke-width="1"/>

  <!-- Conector Modular da Holding Change -->
  <line x1="122" y1="80" x2="164" y2="80" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="146" cy="80" r="5" fill="#f59e0b" stroke="#fef3c7" stroke-width="1"/>

  <!-- Tipografia Modular: ChangeMacro | LABS -->
  <text x="176" y="78" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.5">
    Change<tspan fill="#22d3ee">Macro</tspan>
  </text>

  <!-- Divisor Vertical + Tag LABS -->
  <line x1="422" y1="48" x2="422" y2="86" stroke="#334155" stroke-width="2"/>
  <text x="436" y="74" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="17" letter-spacing="3">
    LABS
  </text>

  <!-- Subtítulo e Ondas Harmônicas -->
  <text x="178" y="103" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11.5" letter-spacing="2.2">
    HOLDING CHANGE • ENGENHARIA MACROECONÔMICA
  </text>
  <path d="M 178 120 Q 200 110, 222 120 T 266 120 T 310 120 T 354 120 T 398 120 T 442 120 T 486 120" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.85"/>
  <path d="M 178 127 Q 200 117, 222 127 T 266 127 T 310 127 T 354 127 T 398 127 T 442 127 T 486 127" fill="none" stroke="#10b981" stroke-width="1.6" opacity="0.65"/>
</svg>
