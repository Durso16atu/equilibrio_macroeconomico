<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kiteLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="kiteRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <!-- Base circular obsidian navy -->
  <circle cx="120" cy="120" r="114" fill="#080c14" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Anéis orbitais de telemetria em abertura 'C' (Holding Change) -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="#10b981" stroke-width="6.5" stroke-dasharray="235 85" transform="rotate(24 120 120)"/>
  <circle cx="120" cy="120" r="91" fill="none" stroke="#06b6d4" stroke-width="5" stroke-dasharray="195 85" transform="rotate(32 120 120)"/>
  <circle cx="120" cy="120" r="81" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-dasharray="165 80" transform="rotate(38 120 120)"/>
  <circle cx="120" cy="120" r="73" fill="none" stroke="#f8fafc" stroke-width="1.8" stroke-dasharray="170 60" opacity="0.9" transform="rotate(20 120 120)"/>
  <circle cx="120" cy="120" r="66" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.75"/>

  <!-- Nodo conector orbital na abertura 'C' à direita -->
  <line x1="175" y1="120" x2="218" y2="120" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="218" cy="120" r="6" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.2"/>

  <!-- Prisma central da Holding Change com ápice âmbar luminoso -->
  <circle cx="120" cy="64" r="18" fill="url(#amberGlow)"/>
  <polygon points="120,68 96,102 120,134" fill="url(#kiteLeft)" stroke="#34d399" stroke-width="1.2"/>
  <polygon points="120,68 144,102 120,134" fill="url(#kiteRight)" stroke="#22d3ee" stroke-width="1.2"/>
  <line x1="120" y1="68" x2="120" y2="134" stroke="#ffffff" stroke-width="2.2"/>
  <circle cx="120" cy="65" r="5.8" fill="#f59e0b" stroke="#fef3c7" stroke-width="1"/>

  <!-- Wordmark ChangeMacro -->
  <text x="120" y="156" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="17">
    Change<tspan fill="#22d3ee">Macro</tspan>
  </text>

  <!-- Ondas harmônicas de equilíbrio na base -->
  <path d="M 68 172 Q 81 162, 94 172 T 120 172 T 146 172 T 172 172" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.9"/>
  <path d="M 68 178 Q 81 168, 94 178 T 120 178 T 146 178 T 172 178" fill="none" stroke="#10b981" stroke-width="1.6" opacity="0.75"/>
</svg>
