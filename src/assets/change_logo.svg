<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kiteLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="kiteRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Base circular obsidian navy -->
  <circle cx="120" cy="120" r="114" fill="#080c14" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Anéis orbitais de telemetria (Esmeralda, Ciano e Azul Safira) em abertura 'C' (Change) -->
  <circle cx="120" cy="120" r="103" fill="none" stroke="#10b981" stroke-width="5.5" stroke-dasharray="95 32 82 36 92 32" transform="rotate(-35 120 120)"/>
  <circle cx="120" cy="120" r="93" fill="none" stroke="#06b6d4" stroke-width="4.2" stroke-dasharray="72 28 96 34 68 38" transform="rotate(18 120 120)"/>
  <circle cx="120" cy="120" r="84" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="86 42 76 38" transform="rotate(65 120 120)"/>
  <circle cx="120" cy="120" r="77" fill="none" stroke="#f8fafc" stroke-width="1.6" stroke-dasharray="185 48" opacity="0.88" transform="rotate(-20 120 120)"/>
  <circle cx="120" cy="120" r="71" fill="none" stroke="#10b981" stroke-width="1.1" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="120" cy="120" r="65" fill="none" stroke="#1d4ed8" stroke-width="1.2" opacity="0.75"/>

  <!-- Prisma central da Holding Change com ápice âmbar luminoso -->
  <circle cx="120" cy="66" r="15" fill="url(#amberGlow)"/>
  <polygon points="120,69 101,93 120,115" fill="url(#kiteLeft)" stroke="#34d399" stroke-width="1"/>
  <polygon points="120,69 139,93 120,115" fill="url(#kiteRight)" stroke="#34d399" stroke-width="1"/>
  <line x1="120" y1="69" x2="120" y2="115" stroke="#ffffff" stroke-width="1.8"/>
  <circle cx="120" cy="67" r="4.6" fill="#f59e0b" stroke="#fef3c7" stroke-width="0.8"/>

  <!-- Wordmark ChangeSafra -->
  <text x="120" y="134" text-anchor="middle" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16.5">
    Change<tspan fill="#34d399">Safra</tspan>
  </text>

  <!-- Pílula ANALYTICS -->
  <rect x="68" y="142" width="104" height="19" rx="5.5" fill="#064e3b" fill-opacity="0.7" stroke="#10b981" stroke-width="1.1"/>
  <text x="120" y="154.5" text-anchor="middle" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="7.8" letter-spacing="2.2">ANALYTICS</text>

  <!-- Ondas harmônicas de equilíbrio abaixo da pílula -->
  <path d="M 68 169 Q 81 159, 94 169 T 120 169 T 146 169 T 172 169" fill="none" stroke="#06b6d4" stroke-width="1.4" opacity="0.8"/>
  <path d="M 68 174 Q 81 164, 94 174 T 120 174 T 146 174 T 172 174" fill="none" stroke="#10b981" stroke-width="1.4" opacity="0.7"/>
</svg>
